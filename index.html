<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>الكتاب التفاعلي التلامسي - WebAR</title>
  
  <!-- مكتبات A-Frame و MindAR -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #scan-hint {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85);
      color: #38bdf8;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      z-index: 999;
      border: 1px solid #38bdf8;
      backdrop-filter: blur(5px);
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!-- تلميح أعلى الشاشة -->
  <div id="scan-hint">👆 اضغط على الأزرار المختلفة في البطاقة للتعرف على محتويات الكتاب</div>
  <!-- مشهد الواقع المعزز AR -->
  <a-scene 
    mindar-image="imageTargetSrc: https://raw.githubusercontent.com/hiukim/mind-ar-js/master/examples/image-tracking/assets/card-example/card.mind; uiLoading: no;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false"
    cursor="rayOrigin: mouse"
    raycaster="objects: .clickable">
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <!-- العنصر التفاعلي المرتبط بالصورة -->
    <a-entity mindar-image-target="targetIndex: 0">
      
      <!-- اللوحة الخلفية الأساسية -->
      <a-plane position="0 0 0" width="1.3" height="0.85" material="color: #0f172a; opacity: 0.9; transparent: true;"></a-plane>
      <a-plane position="0 0 -0.01" width="1.34" height="0.89" material="color: #38bdf8;"></a-plane>
      <!-- اللوحة الرئيسية لعرض المعلومات المحددة -->
      <a-text id="display-title" value="اختر قسماً من الغلاف" position="0 0.25 0.02" align="center" color="#38bdf8" width="3" font="kelsonsans"></a-text>
      <a-text id="display-desc" value="اضغط على الأزرار أدناه لتظهر التفاصيل هنا" position="0 0.05 0.02" align="center" color="#ffffff" width="2.4" font="kelsonsans"></a-text>
      <!-- 1. زر المنتصف: اسم المؤلف -->
      <a-box class="clickable" position="0 -0.22 0.03" width="0.35" height="0.12" depth="0.02" material="color: #f59e0b;" onclick="showInfo('المؤلف', 'اسم المؤلف: فريق المشروع التعليمي المميز')">
        <a-text value="المؤلف" position="0 0 0.02" align="center" color="#ffffff" width="1.5" font="kelsonsans"></a-text>
      </a-box>
      <!-- 2. زر اليمين: عدد الصفحات -->
      <a-box class="clickable" position="0.4 -0.22 0.03" width="0.35" height="0.12" depth="0.02" material="color: #22c55e;" onclick="showInfo('عدد الصفحات', 'يحتوي الكتاب على 150 صفحة تفاعلية')">
        <a-text value="الصفحات" position="0 0 0.02" align="center" color="#ffffff" width="1.5" font="kelsonsans"></a-text>
      </a-box>
      <!-- 3. زر اليسار: الفصول -->
      <a-box class="clickable" position="-0.4 -0.22 0.03" width="0.35" height="0.12" depth="0.02" material="color: #ec4899;" onclick="showInfo('الفصول', 'يتكون الكتاب من 5 فصول رئيسية مشوقة')">
        <a-text value="الفصول" position="0 0 0.02" align="center" color="#ffffff" width="1.5" font="kelsonsans"></a-text>
      </a-box>
    </a-entity>
  </a-scene>
  <script>
    // دالة لتغيير النصوص بناءً على الزر المختار في AR
function showInfo(title, desc) {
      const titleEl = document.getElementById('display-title');
      const descEl = document.getElementById('display-desc');
      titleEl.setAttribute('value', title);
      titleEl.setAttribute('color', '#f59e0b');
      descEl.setAttribute('value', desc);
    }
  </script>
</body>
</html>
